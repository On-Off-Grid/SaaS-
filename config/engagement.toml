# config/engagement.toml — WHO/WHAT this harness is currently hunting.
#
# This committed file is a GENERIC TEMPLATE. Do not put a real engagement here.
# Instead copy it to config/engagement.local.toml (git-ignored) and edit that —
# the local file overrides this one. $PIHUNT_PROGRAM overrides both, per-shell.
#
# Consumed by lib/pihunt-common.sh (pihunt_program / pihunt_engagement_get), which
# every tool uses instead of a hardcoded program slug.

[engagement]
program    = "example-program"   # program slug; drives reports/<program>/ and PIHUNT_PROGRAM
platform   = "intigriti"         # intigriti | hackerone | yeswehack | bugcrowd | private
researcher = "your-handle"       # your researcher handle on the platform
floor      = "HIGH"              # minimum severity to chase: LOW | MEDIUM | HIGH | CRITICAL

[scope]
# ROE guardrail read by the Claude Code PreToolUse scope guard (bin/pihunt-scope-guard).
# It is DEFENSE-IN-DEPTH against accidental out-of-scope requests, NOT a security
# boundary (obfuscated shell can evade host extraction — see the tool header).
#
# HOW IT DECIDES (per host found in a Bash/WebFetch call):
#   - localhost / private ranges        -> always allowed, silently
#   - matches an out_of_scope glob       -> DENIED (out_of_scope wins over in_scope)
#   - matches an in_scope glob            -> allowed, silently
#   - external + in_scope non-empty + unmatched -> CHALLENGED ("ask")
#   - in_scope EMPTY                      -> guard disabled: all hosts allowed
# Globs use fnmatch; "*.example.com" also covers the apex "example.com".
#
# Put your REAL scope in config/engagement.local.toml (git-ignored), NOT here.
# The arrays below stay empty so a fresh clone ships with the guard OFF.
#
# ------------------------------------------------------------------------------
# SANITIZED EXAMPLE (fake hosts — copy the shape into engagement.local.toml):
#
#   in_scope = [
#     "*.example.com",            # wildcard: every subdomain + the apex
#     "api.example.com",          # (explicit entries are fine alongside a wildcard)
#     "203.0.113.42",             # a specific in-scope IP (e.g. a metadata endpoint)
#     "example-partners.net",     # a second in-scope apex domain
#   ]
#   out_of_scope = [
#     "*.customers.example.com",  # customer tenants under an otherwise in-scope wildcard
#     "status.example.com",       # a named subdomain carved out of *.example.com
#     "blog.example.com",         # another explicit carve-out (denied despite the wildcard)
#   ]
#   max_req_per_sec = 10
# ------------------------------------------------------------------------------
in_scope        = []   # populate in engagement.local.toml to ACTIVATE the guard
out_of_scope    = []   # always denied, even when an in_scope glob would match
max_req_per_sec = 10   # advisory rate floor surfaced to the operator
